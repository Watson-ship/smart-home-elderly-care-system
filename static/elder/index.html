<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>居家老人监护系统</title>
<script src="/static/elder/common.js?v=3"></script>
</head>
<body>

<!-- ==================== 登录视图（未登录时显示） ==================== -->
<div id="loginView" class="wrap" style="max-width: 480px; display:none">
  <div style="text-align:center; margin-top: 40px">
    <div style="font-size: 60px; margin-bottom: 8px">🏠</div>
    <h1 style="font-size:28px">居家老人监护系统</h1>
  </div>

  <div class="card" style="margin-top: 30px">
    <label>账号</label>
    <input id="username" value="elder_zhang" placeholder="请输入账号">

    <label>密码</label>
    <input id="password" type="password" value="123456" placeholder="请输入密码"
           onkeydown="if(event.key==='Enter') doLogin()">

    <div class="row" style="margin-top: 20px">
      <button class="block big" onclick="doLogin()" style="font-size:22px; padding:18px">登 录</button>
    </div>
    <div id="msg"></div>
  </div>
</div>

<!-- ==================== 主界面（已登录时显示） ==================== -->
<div id="mainView" class="wrap" style="display:none">

  <!-- 顶部：问候 + 退出 -->
  <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; padding: 10px 0 20px">
    <div id="greeting" style="font-size:22px">您好</div>
    <button onclick="doLogout()" style="
      flex-shrink:0;
      font-size:20px; font-weight:700; letter-spacing:1px;
      padding:14px 26px;
      background:#27272a; color:#f0f4fa;
      border:2px solid #6b7280; border-radius:14px;
      cursor:pointer;
    ">🚪 退出</button>
  </div>

  <!-- SOS 按钮（全页唯一核心） -->
  <div style="text-align:center; margin: 30px 0 20px">
    <div style="font-size:18px; color:#a1a1aa; margin-bottom:20px">遇到紧急情况请按下红色按钮</div>
    <button class="sos-btn" id="sosBtn" onclick="toggleSOS()">SOS<br>求 助</button>
    <div id="sosHint" class="msg" style="text-align:center; font-size:18px; margin-top:15px"></div>
  </div>

  <!-- 下一次吃药信息框 -->
  <div id="medCard" class="big-card info" style="margin-top:20px; display:none">
    <div class="title">💊 吃药提醒</div>
    <div class="main" id="medMain">—</div>
    <div class="sub2" id="medSub">正在加载…</div>
  </div>

  <!-- 底部：帮助文字 + 测试按钮（开发演示用） -->
  <div class="empty" style="margin-top:30px; font-size:14px; opacity:.6">
    吃药时间到了会自动弹窗并语音提醒您<br>
    如有紧急情况请按上方红色 SOS 按钮
  </div>

  <div id="devBar" style="margin-top: 30px; text-align:center">
    <button onclick="testReminder()" style="font-size:13px; padding:6px 14px; background:#27272a; border:1px solid #3f3f46; color:#a1a1aa; border-radius:8px; cursor:pointer">🧪 测试提醒效果</button>
    <button onclick="resetAll()" style="font-size:13px; padding:6px 14px; background:#27272a; border:1px solid #3f3f46; color:#a1a1aa; border-radius:8px; cursor:pointer; margin-left:6px">重置本地状态</button>
  </div>
</div>

<script>
/* ==================== 启动：自动判断登录状态 ==================== */
const _tok = getToken();
if (_tok) {
  showMain();
} else {
  document.getElementById("loginView").style.display = "block";
}

/* ==================== 登录 ==================== */
async function doLogin() {
  const u = $("username").value.trim();
  const p = $("password").value;
  if (!u || !p) { msg("请填写账号和密码", "bad"); return; }
  msg("登录中…");
  try {
    const data = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ username: u, password: p }),
    });
    setToken(data.token);
    setUser({ user_id: data.user_id, role: data.role, elder_id: data.elder_id });
    if (data.role !== "elder") {
      msg("此账号不是老人账号", "bad");
      localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY);
      return;
    }
    showMain();
  } catch (e) { msg(e.message, "bad"); }
}

function showMain() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("mainView").style.display = "block";

  // 问候语
  api("/api/auth/me").then(me => {
    document.getElementById("greeting").innerHTML =
      `<span style="font-size:16px; color:#a1a1aa">您好</span><br>${me?.username || "您"}`;
  }).catch(() => {});

  refreshSOS(); loadPlans();
  setInterval(refreshSOS, 20000);
  setInterval(loadPlans, 30000);

  registerMedicineReminder({
    getPlans: async () => {
      const page = await api("/api/medicine/plans?size=50");
      return (page?.items || []).filter(p => p.status === 1);
    },
  });
}

/* ==================== SOS ==================== */
let sosActive = false;
async function refreshSOS() {
  try {
    const alerts = await api("/api/alert/my?limit=20");
    sosActive = (alerts || []).some(a => a.alert_type === "sos" && a.is_handled === 0);
    setSOSUI(sosActive);
  } catch {}
}
function setSOSUI(active) {
  const btn = $("sosBtn"); const hint = $("sosHint");
  if (active) {
    btn.className = "sos-btn cancel";
    btn.innerHTML = "取消<br>求 助";
    hint.textContent = "已通知家属和社区。如已安全，请按橙色按钮取消。";
    hint.className = "msg warn";
  } else {
    btn.className = "sos-btn";
    btn.innerHTML = "SOS<br>求 助";
    hint.textContent = ""; hint.className = "msg";
  }
}
async function toggleSOS() {
  const btn = $("sosBtn"); btn.disabled = true;
  try {
    if (!sosActive) {
      btn.textContent = "发送中…";
      await api("/api/alert/sos", { method: "POST", body: "{}" });
      sosActive = true; setSOSUI(true);
      speak("已发送求助信号");
    } else {
      btn.textContent = "取消中…";
      const data = await api("/api/alert/sos/cancel", { method: "POST", body: "{}" });
      if (data.cancelled) { sosActive = false; setSOSUI(false); speak("求助已取消"); }
      else { $("sosHint").textContent = data.message || "没有待取消的求助"; $("sosHint").className = "msg warn"; }
    }
  } catch (e) { $("sosHint").textContent = "失败：" + e.message; $("sosHint").className = "msg bad"; }
  finally { btn.disabled = false; }
}

/* ==================== 吃药预览 ==================== */
async function loadPlans() {
  try {
    const page = await api("/api/medicine/plans?size=50");
    const all = (page?.items || []).filter(p => p.status === 1);
    if (!all.length) { $("medCard").style.display = "none"; return; }

    const todayStr = localDateStr();
    const now = new Date();
    const curMin = now.getHours() * 60 + now.getMinutes();
    const records = await api("/api/medicine/record").catch(() => []);
    // 后端字段: remind_date(YYYY-MM-DD) + take_result("taken"/"untaken")
    const takenIds = new Set((records || [])
      .filter(r => String(r.remind_date || "").slice(0,10) === todayStr && r.take_result === "taken")
      .map(r => r.plan_id));
    const localMap = loadConfirmedToday();
    if (localMap._date === todayStr) Object.keys(localMap).filter(k=>k!=='_date').forEach(id=>takenIds.add(Number(id)));

    const sorted = all.filter(p => !takenIds.has(p.id))
      .filter(p => p.cycle !== "two_day" || now.getDate() % 2 === 0)
      .sort((a,b) => String(a.take_time).localeCompare(String(b.take_time)));
    if (!sorted.length) { $("medCard").style.display = "none"; return; }

    const next = sorted.find(p => {
      const [h,m] = String(p.take_time).slice(0,5).split(":").map(Number);
      return h*60+m >= curMin;
    }) || sorted[0];
    const tStr = String(next.take_time).slice(0,5);

    $("medCard").style.display = "block";
    $("medMain").textContent = `${next.medicine_name}  ${tStr}`;
    $("medSub").textContent = `剂量：${next.dosage || '—'}`;
  } catch {}
}

/* ==================== 退出登录 ==================== */
function doLogout() {
  if (confirm("确定要退出登录吗？")) logout();
}

/* ==================== 开发测试 ==================== */
const TEST_PLAN_ID = 99999;
function testReminder() {
  // 清掉上一次测试留下的状态, 保证每次点都能看到弹窗
  const st = loadReminderState();
  delete st[TEST_PLAN_ID];
  saveReminderState(st);
  markReminderTriggered(TEST_PLAN_ID);
  showMedicineReminder(
    { id: TEST_PLAN_ID, medicine_name: "降压灵", dosage: "1片", take_time: "08:00" },
    { count: 0, total: 3 },
    {
      onTaken: () => {
        markReminderConfirmed(TEST_PLAN_ID);
        speak("好的");
      }
    }
  );
}
function resetAll() {
  if (!confirm("确定要重置所有提醒状态吗？")) return;
  localStorage.removeItem(REMINDER_STATE_KEY);
  localStorage.removeItem("elder_confirmed_today");
  localStorage.removeItem("elder_reminder_v2");
  location.reload();
}
</script>
</body>
</html>

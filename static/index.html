<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社康端 - 居家老人监测系统</title>
    <!-- 引入 Bootstrap 和 ECharts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 引入 Axios 发送请求 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

        <!-- 顶栏 -->
    <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
        <span class="navbar-brand mb-0 h1">🏥 社康监控后台</span>
        <div class="d-flex align-items-center">
            <span id="loginStatus" class="text-white me-3">未登录</span>
            <button id="logoutBtn" class="btn btn-sm btn-light d-none" onclick="logout()">退出登录</button>
        </div>
    </nav>

    <div class="d-flex" id="main-container">
        <!-- 侧边栏导航 -->
        <div class="bg-white border-end p-3 shadow-sm" style="width: 200px; min-height: calc(100vh - 56px);">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="#" onclick="switchView('view-elder')">👴 老人档案</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="switchView('view-order')">📋 工单看板</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="switchView('view-dashboard')">📊 AI监控面板</a></li>
            </ul>
        </div>

        <!-- 主内容区 -->
        <div class="flex-grow-1 p-4">

            <!-- 页面 1：老人档案 -->
            <div id="view-elder" class="view-section">
                <div class="d-flex justify-content-between mb-3">
                    <h3>老人档案</h3>
                    <button class="btn btn-success" onclick="loadElders()">🔄 刷新数据</button>
                </div>
                <table class="table table-hover table-bordered bg-white shadow-sm">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th><th>姓名</th><th>性别</th><th>年龄</th><th>电话</th><th>住址</th>
                        </tr>
                    </thead>
                    <tbody id="elderTableBody">
                        <!-- 数据由 JS 渲染 -->
                    </tbody>
                </table>
            </div>

            <!-- 页面 2：工单看板 (三列) -->
            <div id="view-order" class="view-section d-none">
                <h3 class="mb-3">社康工单看板</h3>
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="card bg-warning bg-opacity-10 shadow-sm">
                            <div class="card-header fw-bold">待派单 (Pending)</div>
                            <div class="card-body" id="order-pending"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-info bg-opacity-10 shadow-sm">
                            <div class="card-header fw-bold">处置中 (Processing)</div>
                            <div class="card-body" id="order-processing"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-success bg-opacity-10 shadow-sm">
                            <div class="card-header fw-bold">已归档 (Archived)</div>
                            <div class="card-body" id="order-archived"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 页面 3：AI 监控面板 -->
            <div id="view-dashboard" class="view-section d-none">
                <h3 class="mb-3">AI 实时监控</h3>
                <div class="row">
                    <div class="col-md-6">
                        <div class="card shadow-sm">
                            <div class="card-header">今日告警类型分布</div>
                            <div class="card-body">
                                <div id="echart-pie" style="width: 100%; height: 300px;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card shadow-sm">
                            <div class="card-header text-danger fw-bold">🚨 最新告警流</div>
                            <div class="card-body" id="alert-stream" style="height: 300px; overflow-y: auto;">
                                <!-- 告警流 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- 登录遮罩层 -->
    <div id="login-layer" class="d-flex justify-content-center align-items-center" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 9999;">
        <div class="card p-4 shadow-lg" style="width: 350px; border-radius: 15px;">
            <h3 class="text-center mb-4">🏥 社康端登录</h3>
            <div class="mb-3">
                <label class="form-label">账号</label>
                <input type="text" id="login-username" class="form-control" placeholder="请输入用户名 (如: zjx)">
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" id="login-password" class="form-control" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary w-100 mt-2" onclick="doLogin()">登录系统</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
